# Proxy HTTP do Havicare Hub.
#
# Instalação:
#   install -Dm644 config/nginx/havicare-hub.conf \
#     /etc/nginx/conf.d/havicare-hub.conf
#   nginx -t && systemctl reload nginx
#
# O ficheiro chamou-se `health-smartwatches.conf` até 4 de setembro de 2026, nome
# anterior ao do projeto. O `conf.d/*.conf` carrega por padrão, e não por nome.
#
# Tudo vai para a instância de produção, que serve a dashboard e a API no mesmo
# servidor HTTP. A de desenvolvimento (8091) fica de fora de propósito: quem a usa
# entra pela porta dela.
upstream hub_prod { server 127.0.0.1:8081; }

# Porto 80: o desafio do Let's Encrypt, e mais nada além do encaminhamento para
# HTTPS. Três dias de registo de acesso a este porto não têm um único pedido
# legítimo -- é tudo varrimento automático da Internet à procura de `/.env` e de
# `/.git/config` --, por isso o redireccionamento não tira nada a ninguém.
server {
    listen 80;
    server_name _;

    # Tem de ser servido do disco: passado ao hub, que não conhece esta rota, daria
    # 404 e a renovação do certificado falhava. O `^~` ganha ao `location /` sem
    # depender da ordem.
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Nome fixo, e não `$host`: com `server_name _` este bloco aceita qualquer
    # cabeçalho `Host`, e reflectir um forjado mandaria o cliente para fora.
    location / {
        return 301 https://sockets.hitcare.net$request_uri;
    }
}

server {
    listen 443 ssl;
    http2 on;
    server_name sockets.hitcare.net;

    ssl_certificate     /etc/letsencrypt/live/sockets.hitcare.net/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/sockets.hitcare.net/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;

    # Sem HSTS por enquanto. Obrigaria o browser a usar HTTPS em todo o domínio,
    # incluindo o acesso directo ao `:8081` que os integradores ainda usam, e o
    # efeito fica gravado no browser durante o tempo que se declarar. Entra quando
    # o `:8081` deixar de ser preciso.

    # O `/api/stream` é SSE, e o proxy tem de o deixar passar a fio. Com o buffering
    # ligado o nginx segura os eventos até encher o buffer, e o cliente vê a ligação
    # pendurada. O hub já manda `X-Accel-Buffering: no`, que basta -- isto é o mesmo
    # dito na configuração, para não depender de um cabeçalho da aplicação.
    #
    # O `proxy_read_timeout` por omissão são 60 s. O keep-alive do stream é de 15 s e
    # repõe o contador, mas uma hora dá folga a qualquer pausa.
    location /api/stream {
        proxy_pass http://hub_prod;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 1h;
    }

    location / {
        proxy_pass http://hub_prod;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Nada de cabeçalhos CORS aqui: o hub já responde com os dele, e duplicados
    # fazem o browser recusar a resposta.
}

# A configuração anterior tinha um `upstream ws_backend` para o 127.0.0.1:8080 -- a
# porta da ingestão TCP dos relógios -- com o `location /` a apontar-lhe. Qualquer
# pedido HTTP que não casasse com as rotas nomeadas era entregue como bytes ao
# analisador de tramas de dispositivo, e a raiz do porto 80 não respondia de todo.
# A ingestão não fala HTTP e não tem nada que estar atrás de um proxy web.
#
# As rotas nomeadas que existiam -- /devices, /suppliers, /models, /events, /demo,
# /openapi.json, /docs, /health, /metrics -- ficaram para trás do encaminhamento do
# hub, que serve tudo sob `/api/`. Nenhuma delas respondia: davam 404.
