# Proxy HTTP do Havicare Hub.
#
# Instalação:
#   install -Dm644 config/nginx/havicare-hub.conf \
#     /etc/nginx/conf.d/havicare-hub.conf
#   nginx -t && systemctl reload nginx
#
# Tudo vai para a produção; a de desenvolvimento (8091) entra pela porta dela.
upstream hub_prod { server 127.0.0.1:8081; }

# Porto 80: o desafio do Let's Encrypt e o redireccionamento para HTTPS, e mais nada.
server {
    listen 80;
    server_name _;

    # Servido do disco, porque o hub não conhece esta rota. O `^~` ganha ao `location /` sem
    # depender da ordem.
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Nome fixo, e não `$host`: com `server_name _` este bloco aceita qualquer
    # cabeçalho `Host`, e reflectir um forjado mandaria o cliente para fora.
    location / {
        return 301 https://sockets.hitcare.net$request_uri;
    }
}

server {
    listen 443 ssl;
    http2 on;
    server_name sockets.hitcare.net;

    ssl_certificate     /etc/letsencrypt/live/sockets.hitcare.net/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/sockets.hitcare.net/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;

    # Sem HSTS enquanto os integradores usarem o acesso directo ao `:8081`: o efeito fica gravado
    # no browser.

    # O `/api/stream` é SSE e passa a fio: com buffering, o nginx segura os eventos. É o mesmo que
    # o `X-Accel-Buffering: no` do hub, dito na configuração.
    # Uma hora de `proxy_read_timeout` dá folga a qualquer pausa do keep-alive de 15 s.
    location /api/stream {
        proxy_pass http://hub_prod;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 1h;
    }

    location / {
        proxy_pass http://hub_prod;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Nada de cabeçalhos CORS aqui: o hub já responde com os dele, e duplicados
    # fazem o browser recusar a resposta.
}
