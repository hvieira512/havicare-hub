# Carrega a extensão `ev` só na instância de desenvolvimento.
#
# O pacote `php-pecl-ev` instala `/etc/php.d/40-ev.ini`, que é carregado por
# **todos** os processos PHP da máquina. Com esse ficheiro activo, a produção
# trocaria de event loop no próximo reinício -- um `make update`, um reboot, ou o
# `Restart=always` depois de um soluço -- sem uma linha de diferença em código.
#
# Este drop-in evita isso: o `40-ev.ini` fica desactivado, e a extensão é
# carregada apenas por esta unit, pela linha de comando.
#
#   dnf install php-pecl-ev
#   mv /etc/php.d/40-ev.ini /etc/php.d/40-ev.ini.disabled
#   install -Dm644 config/systemd/ev-loop-dev.conf \
#     /etc/systemd/system/havicare-hub-dev.service.d/ev-loop.conf
#   systemctl daemon-reload && systemctl restart havicare-hub-dev
#
# Confirmar no journal: o `StartupBanner` imprime a classe do loop escolhida, e
# tem de passar a dizer `ExtEvLoop (epoll)`. A produção tem de continuar a dizer
# `StreamSelectLoop`.
#
# Reverter é remover este ficheiro e recarregar: sem a extensão, o ReactPHP volta
# ao `StreamSelectLoop` sozinho.
#
# O `ExecStart=` vazio é obrigatório -- sem ele, o systemd acrescentaria um
# segundo comando em vez de substituir o da unit.

[Service]
ExecStart=
ExecStart=/usr/bin/php -d extension=ev /opt/havicare-hub-dev/bin/server-hub.php
