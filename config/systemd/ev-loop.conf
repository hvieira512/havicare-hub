# Carrega a extensão `ev`, e serve as duas instâncias.
#
# O ReactPHP escolhe a melhor implementação de loop entre as extensões
# instaladas. Sem nenhuma, cai no `StreamSelectLoop`, que é `select(2)` com o
# `FD_SETSIZE` fixo em 1024 -- um limite da implementação, que nenhum
# `LimitNOFILE` levanta. Com a `ev`, passa a `ExtEvLoop`, que usa epoll.
#
# O pacote `php-pecl-ev` instala `/etc/php.d/40-ev.ini`, carregado por **todos**
# os processos PHP da máquina. Com esse ficheiro activo, qualquer instância troca
# de loop no próximo reinício, seja ele um `make update`, um reboot ou o
# `Restart=always` depois de um soluço. Este drop-in existe para que a troca seja
# uma decisão por instância e não um efeito lateral:
#
#   dnf install php-pecl-ev
#   mv /etc/php.d/40-ev.ini /etc/php.d/40-ev.ini.disabled
#
# O caminho do script é **relativo de propósito**, e é o que permite um ficheiro
# só para as duas units: o PHP resolve-o a partir do directório de trabalho, que
# ambas declaram em `WorkingDirectory`. Uma unit nova que a esqueça arranca o
# script errado -- é a única dependência a ter em conta ao reutilizar isto.
#
#   install -Dm644 config/systemd/ev-loop.conf \
#     /etc/systemd/system/havicare-hub.service.d/ev-loop.conf
#   systemctl daemon-reload && systemctl restart havicare-hub
#
# Confirmar no journal: o `StartupBanner` tem de passar a dizer
# `Event loop: React\EventLoop\ExtEvLoop (epoll)`.
#
# Reverter é apagar este ficheiro e recarregar: sem a extensão, o ReactPHP volta
# ao `StreamSelectLoop` sozinho.
#
# O `ExecStart=` vazio é obrigatório -- sem ele, o systemd acrescentaria um
# segundo comando em vez de substituir o da unit.

[Service]
ExecStart=
ExecStart=/usr/bin/php -d extension=ev bin/server-hub.php
