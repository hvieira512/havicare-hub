# Carrega a extensão `ev` só para as instâncias do hub, com o ini global desligado:
#
#   dnf install php-pecl-ev
#   mv /etc/php.d/40-ev.ini /etc/php.d/40-ev.ini.disabled
#
# O caminho do script é relativo ao `WorkingDirectory`, para um ficheiro servir as duas units.
# O `ExecStart=` vazio é obrigatório: sem ele, o systemd acrescenta um segundo comando.
#
#   install -Dm644 config/systemd/ev-loop.conf \
#     /etc/systemd/system/havicare-hub.service.d/ev-loop.conf
#   systemctl daemon-reload && systemctl restart havicare-hub
#
# Confirmar no journal: o `StartupBanner` tem de passar a dizer
# `Event loop: React\EventLoop\ExtEvLoop (epoll)`. Reverter é apagar este ficheiro e recarregar.

[Service]
ExecStart=
ExecStart=/usr/bin/php -d extension=ev bin/server-hub.php
