# Descritores de ficheiro para as instâncias do hub.
#
# NÃO INSTALAR SEM UMA EXTENSÃO DE EVENT LOOP. Ler o porquê antes de o usar.
#
# O ReactPHP escolhe a melhor implementação de loop disponível. Sem nenhuma das
# extensões `ev`, `event` ou `uv` instaladas, cai no `StreamSelectLoop`, que é
# `stream_select()` -- ou seja, o `select(2)` do sistema, com o `FD_SETSIZE`
# fixo em **1024** no Linux. É um limite da implementação, e não do sistema
# operativo: nenhum `LimitNOFILE` o levanta.
#
# Medido na instância de desenvolvimento, a abrir streams em rampa: o processo
# encalha exactamente nos 1025 descritores e **deixa de servir tudo** -- a API
# passa a não responder, e os descritores não são libertados nem depois de os
# clientes fecharem. Não morre, e por isso o `Restart=always` não o recupera; é
# preciso reiniciar à mão. É a pior forma de falhar, e afecta também a ingestão
# TCP dos relógios, que partilha o processo.
#
# Com o limite do SO nos 1024 de omissão, o `accept()` falha com EMFILE antes de
# o `select()` se partir, e o loop continua a servir o que já tem. É uma falha
# muito mais limpa, e por isso **1024 é a configuração correcta enquanto o loop
# for o `StreamSelectLoop`**.
#
# Este ficheiro só faz sentido depois de instalar uma extensão de loop, que usa
# epoll e não tem este teto:
#
#   dnf install php-pecl-ev     # AlmaLinux/remi; confirmar com `php -m | grep ev`
#   php -r 'require "vendor/autoload.php";
#           echo get_class(React\EventLoop\Loop::get()), PHP_EOL;'
#           # deve dizer ExtEvLoop, e não StreamSelectLoop
#
# Só então:
#
#   install -Dm644 config/systemd/limit-nofile.conf \
#     /etc/systemd/system/havicare-hub-dev.service.d/limit-nofile.conf
#   systemctl daemon-reload && systemctl restart havicare-hub-dev
#
# E aí o `DASHBOARD_MAX_OPEN_STREAMS` pode subir dos 400 conservadores para os
# ~2000 que o orçamento de memória permite (~128 KB de pior caso por ligação).

[Service]
LimitNOFILE=8192
