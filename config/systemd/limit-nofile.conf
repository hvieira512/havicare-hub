# Descritores de ficheiro para as instâncias do hub.
#
# NÃO INSTALAR SEM UMA EXTENSÃO DE EVENT LOOP: com o `StreamSelectLoop` o tecto são 1024
# descritores, e subir isto troca um EMFILE limpo por um processo vivo e mudo.
#
# Confirmar primeiro que o loop é o `ExtEvLoop`:
#
#   php -r 'require "vendor/autoload.php";
#           echo get_class(React\EventLoop\Loop::get()), PHP_EOL;'
#
# Só então:
#
#   install -Dm644 config/systemd/limit-nofile.conf \
#     /etc/systemd/system/havicare-hub-dev.service.d/limit-nofile.conf
#   systemctl daemon-reload && systemctl restart havicare-hub-dev
#
# Depois, o `DASHBOARD_MAX_OPEN_STREAMS` pode subir dos 400 para ~2000 (~128 KB por ligação).

[Service]
LimitNOFILE=8192
