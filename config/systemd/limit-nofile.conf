# Descritores de ficheiro para as duas instâncias do hub.
#
# O limite flexível de omissão do systemd é 1024, e um processo do hub gasta um
# descritor por cada coisa que aceita: as ligações TCP dos relógios, os sockets
# MQTT, os pedidos HTTP, e -- a partir do `/api/stream` -- cada ligação de
# eventos aberta, que é um pedido que nunca termina.
#
# Com 1024 os descritores esgotam-se muito antes dos tetos da aplicação
# (`DASHBOARD_MAX_OPEN_STREAMS`), e esgotar descritores no processo que também
# aceita as ligações dos relógios é a pior forma de descobrir o limite. O rígido
# da máquina já é 524288, pelo que subir o flexível não pede nada ao kernel.
#
# 8192 dá folga larga sobre o teto de 2000 streams sem ser um número sem sentido.
#
# Instalar como drop-in nas duas units:
#
#   install -Dm644 config/systemd/limit-nofile.conf \
#     /etc/systemd/system/havicare-hub.service.d/limit-nofile.conf
#   install -Dm644 config/systemd/limit-nofile.conf \
#     /etc/systemd/system/havicare-hub-dev.service.d/limit-nofile.conf
#   systemctl daemon-reload
#   systemctl restart havicare-hub-dev    # e havicare-hub, quando for a altura
#
# Um drop-in e não uma edição da unit: a unit não está versionada, e assim esta
# alteração fica num ficheiro só nosso, que um `daemon-reload` aplica sem tocar
# no resto.

[Service]
LimitNOFILE=8192
