# Reinício de um processo pendurado, e reinício que não desiste cedo demais.
#
# O `Restart=always` das units reage ao processo terminar; o modo de falha que
# mais interessa não termina nada -- o loop encalha e o systemd continua a ver
# `active (running)`. O `WatchdogSec` fecha essa lacuna: o `SystemdWatchdog`
# manda `WATCHDOG=1` de um temporizador do event loop, logo o ping só sai se o
# loop estiver a girar.
#
# `NotifyAccess=main` com `Type=simple` é deliberado: o systemd passa o
# `NOTIFY_SOCKET` e vigia os pings sem exigir um `READY=1` no arranque. O pior
# caso passa a ser o watchdog não funcionar, e não a unit ser declarada como não
# tendo arrancado.
#
# 60s com ping a cada 30 dá margem larga de propósito: um reinício derruba todas
# as ligações TCP dos relógios, por isso disparar por engano tem custo real.
#
# Atenção à secção: o `StartLimitIntervalSec` e o `StartLimitBurst` vivem em
# `[Unit]`, e não em `[Service]`. Postos no lugar errado, o systemd escreve
# `Unknown key ... ignoring` no journal e segue com os valores de omissão -- que
# é precisamente a falha silenciosa que este ficheiro existe para evitar.
#
#   install -Dm644 config/systemd/watchdog.conf \
#     /etc/systemd/system/havicare-hub-dev.service.d/watchdog.conf
#   systemctl daemon-reload && systemctl restart havicare-hub-dev
#
# Confirmar no journal: o `StartupBanner` passa a dizer `Watchdog: ping a cada
# 30.0s`. Se disser `desligado`, o `NOTIFY_SOCKET` não chegou ao processo.
#
# Requer systemd 254 ou superior pelo `RestartSteps`/`RestartMaxDelaySec`.

[Unit]`, e não em `[Service]`. Postos no lugar errado, o systemd escreve
# `Unknown key ... ignoring` no journal e segue com os valores de omissão -- que
# é precisamente a falha silenciosa que este ficheiro existe para evitar.

[Unit]
StartLimitIntervalSec=300s
StartLimitBurst=20

[Service]
NotifyAccess=main
WatchdogSec=60s
RestartSteps=5
RestartMaxDelaySec=30s
