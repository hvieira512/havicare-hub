# Reinício de um processo pendurado, e reinício que não desiste cedo demais.
#
# As units têm `Restart=always`, que reage ao processo **terminar**. O modo de
# falha que mais interessa não termina nada: quando o hub esgotou os descritores
# que o `select()` conseguia vigiar, ficou vivo e deixou de servir -- API sem
# resposta, descritores nunca libertados, e o systemd a reportar
# `active (running)` porque não havia nada de errado que ele soubesse ver. Zero
# reinícios automáticos no journal, e foi preciso reiniciar à mão.
#
# `WatchdogSec` fecha essa lacuna. O `SystemdWatchdog` manda `WATCHDOG=1` de um
# temporizador do event loop, e por isso o ping **só sai se o loop estiver a
# girar**: é prova de vivacidade, e não de existência. Se o loop encalhar, os
# pings param e o systemd mata e reinicia.
#
# `NotifyAccess=main` com `Type=simple` é deliberado: assim o systemd passa o
# `NOTIFY_SOCKET` e vigia os pings **sem** exigir um `READY=1` no arranque, que é
# o que o `Type=notify` obrigaria. Uma implementação com um defeito no arranque
# faria o serviço ser declarado como não tendo arrancado; assim, o pior caso é o
# watchdog não funcionar e a unit continuar a servir.
#
# 60s com ping a cada 30 dá margem larga: um pico que atrase o loop dois ou três
# segundos não reinicia nada. E um reinício **derruba todas as ligações TCP dos
# relógios**, pelo que disparar por engano tem custo real -- daí a margem.
#
# As três chaves de `StartLimit`/`Restart` resolvem um problema diferente e
# pré-existente: os valores de omissão são `StartLimitBurst=5` em 10s, ou seja,
# se algo fizer o processo morrer logo e repetidamente -- um `.env` mal formado,
# uma extensão que deixou de carregar depois de uma subida de PHP, o MySQL ainda
# a arrancar -- o systemd tenta cinco vezes em dez segundos e **desiste, deixando
# o serviço morto**. Uma janela de 5 minutos com backoff exponencial aguenta uma
# dependência lenta a recuperar, e continua a desistir de uma falha permanente,
# que é o que a torna visível no `systemctl status`.
#
#   install -Dm644 config/systemd/watchdog.conf \
#     /etc/systemd/system/havicare-hub-dev.service.d/watchdog.conf
#   systemctl daemon-reload && systemctl restart havicare-hub-dev
#
# Confirmar no journal: o `StartupBanner` passa a dizer `Watchdog: ping a cada
# 30.0s`. Se disser `desligado`, o `NOTIFY_SOCKET` não chegou ao processo.
#
# Requer systemd 254 ou superior pelo `RestartSteps`/`RestartMaxDelaySec`.

[Service]
NotifyAccess=main
WatchdogSec=60s

StartLimitIntervalSec=300s
StartLimitBurst=20
RestartSteps=5
RestartMaxDelaySec=30s
