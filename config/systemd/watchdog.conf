# Reinício de um processo pendurado, e reinício que não desiste cedo demais.
#
# O `Restart=always` só reage ao processo terminar; o `WatchdogSec` apanha o loop encalhado,
# porque o `SystemdWatchdog` só manda `WATCHDOG=1` com o loop a girar.
#
# `NotifyAccess=main` com `Type=simple` vigia os pings sem exigir `READY=1` no arranque. 60 s
# com ping a cada 30 dá margem larga: um reinício derruba as ligações TCP dos relógios.
#
# O `StartLimitIntervalSec` e o `StartLimitBurst` vivem em `[Unit]`: em `[Service]` o systemd
# ignora-os, com um `Unknown key` no journal.
#
#   install -Dm644 config/systemd/watchdog.conf \
#     /etc/systemd/system/havicare-hub-dev.service.d/watchdog.conf
#   systemctl daemon-reload && systemctl restart havicare-hub-dev
#
# Confirmar no journal: o `StartupBanner` passa a dizer `Watchdog: ping a cada
# 30.0s`. Se disser `desligado`, o `NOTIFY_SOCKET` não chegou ao processo.
#
# Requer systemd 254 ou superior pelo `RestartSteps`/`RestartMaxDelaySec`.

[Unit]
StartLimitIntervalSec=300s
StartLimitBurst=20

[Service]
NotifyAccess=main
WatchdogSec=60s
RestartSteps=5
RestartMaxDelaySec=30s
