<!doctype html>
<html lang="pt-PT">
    <head>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <title>Hitecosystem Hub de Dispositivos</title>
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
        <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" rel="stylesheet">
    </head>
    <body class="bg-body-tertiary">
        <nav class="navbar navbar-expand-lg bg-dark navbar-dark">
            <div class="container-fluid">
                <span class="navbar-brand"><i class="fa-solid fa-satellite-dish me-2"></i>hitHub</span>
                <div class="d-flex align-items-center gap-2">
                    <span id="hubCounts" class="navbar-text small"></span>
                    <button id="manageSuppliersBtn" class="btn btn-sm btn-outline-light"><i class="fa-solid fa-building me-1"></i>Fornecedores</button>
                    <button id="manageModelsBtn" class="btn btn-sm btn-outline-light"><i class="fa-solid fa-cubes me-1"></i>Modelos</button>
                </div>
            </div>
        </nav>
        <main class="container-fluid py-3">
            <div class="row g-3">
                <aside id="deviceColumn" class="col-12 col-lg-4">
                    <div class="card shadow-sm">
                        <div class="card-header d-flex justify-content-between align-items-center">
                            <span><i class="fa-solid fa-watch-fitness me-2"></i>Dispositivos</span>
                            <button id="addDeviceBtn" class="btn btn-sm btn-outline-primary"><i class="fa-solid fa-plus me-1"></i>Adicionar</button>
                        </div>
                        <div id="deviceList"></div>
                    </div>
                </aside>
                <section id="detailColumn" class="col-12 col-lg-8">
                    <div class="card shadow-sm">
                        <div class="card-body">
                            <div id="emptyState" class="text-center text-secondary py-5">
                                <i class="fa-solid fa-tablet-screen-button fs-1 opacity-25"></i>
                                <h1 class="h5 mt-3">Selecione um dispositivo</h1>
                            </div>
                            <div id="deviceDetail" class="d-none">
                                <div class="d-flex justify-content-between align-items-start mb-3">
                                    <div>
                                        <h1 class="h4 mb-1" id="detailTitle"></h1>
                                        <div class="text-secondary" id="detailMeta"></div>
                                    </div>
                                    <span id="detailBadge" class="badge"></span>
                                </div>
                                <div class="vstack gap-4">
                                    <section>
                                        <div class="d-flex justify-content-between align-items-center mb-2">
                                            <h2 class="h6 mb-0">Dados do dispositivo e pedidos</h2>
                                            <span class="small text-secondary" id="requestCardCount"></span>
                                        </div>
                                        <div class="row g-3" id="requestGrid"></div>
                                    </section>
                                    <section>
                                        <h2 class="h6 mb-2">Pedidos ao dispositivo</h2>
                                        <div id="downlinkRequests"></div>
                                    </section>
                                </div>
                            </div>
                        </div>
                    </div>
                </section>
            </div>
        </main>

        <div class="modal fade" id="deviceModal" tabindex="-1">
            <div class="modal-dialog">
                <div class="modal-content">
                    <div class="modal-header">
                        <h5 class="modal-title" id="deviceModalLabel">Dispositivo</h5>
                        <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                    </div>
                    <div class="modal-body">
                        <form id="deviceForm">
                            <div class="mb-3">
                                <label for="deviceImei" class="form-label">IMEI</label>
                                <input type="text" class="form-control" id="deviceImei" required>
                            </div>
                            <div class="mb-3">
                                <label for="deviceSupplier" class="form-label">Fornecedor</label>
                                <input type="text" class="form-control" id="deviceSupplier" list="supplierList" required>
                                <datalist id="supplierList"></datalist>
                            </div>
                            <div class="mb-3">
                                <label for="deviceModel" class="form-label">Modelo</label>
                                <input type="text" class="form-control" id="deviceModel" list="modelList" required>
                                <datalist id="modelList"></datalist>
                            </div>
                        </form>
                    </div>
                    <div class="modal-footer">
                        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
                        <button id="saveDeviceBtn" type="button" class="btn btn-primary">Guardar</button>
                    </div>
                </div>
            </div>
        </div>

        <div class="modal fade" id="supplierModal" tabindex="-1">
            <div class="modal-dialog">
                <div class="modal-content">
                    <div class="modal-header">
                        <h5 class="modal-title">Fornecedores</h5>
                        <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                    </div>
                    <div class="modal-body">
                        <form id="supplierForm" class="row g-2 mb-3 p-2 border rounded bg-body-tertiary">
                            <div class="col-md-8">
                                <input type="text" class="form-control form-control-sm" id="supplierName" placeholder="Nome do fornecedor" required>
                            </div>
                            <div class="col-md-4">
                                <button id="saveSupplierBtn" type="button" class="btn btn-primary btn-sm w-100"><i class="fa-solid fa-plus me-1"></i>Adicionar</button>
                            </div>
                        </form>
                        <table class="table table-sm">
                            <thead><tr><th>Nome</th><th>Modelos</th><th>Estado</th><th></th></tr></thead>
                            <tbody id="supplierListBody"></tbody>
                        </table>
                    </div>
                    <div class="modal-footer">
                        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Fechar</button>
                    </div>
                </div>
            </div>
        </div>

        <div class="modal fade" id="modelModal" tabindex="-1">
            <div class="modal-dialog">
                <div class="modal-content">
                    <div class="modal-header">
                        <h5 class="modal-title" id="modelModalLabel">Modelos</h5>
                        <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                    </div>
                    <div class="modal-body">
                        <form id="modelForm" class="row g-2 mb-3 p-2 border rounded bg-body-tertiary">
                            <div class="col-md-3">
                                <select class="form-select form-select-sm" id="modelSupplier" required>
                                    <option value="">Fornecedor...</option>
                                </select>
                            </div>
                            <div class="col-md-3">
                                <input type="text" class="form-control form-control-sm" id="modelModel" placeholder="Modelo" required>
                            </div>
                            <div class="col-md-3">
                                <input type="text" class="form-control form-control-sm" id="modelProtocol" placeholder="Protocolo" required>
                            </div>
                            <div class="col-md-2">
                                <input type="file" class="form-control form-control-sm" id="modelImage" accept="image/*">
                            </div>
                            <div class="col-md-1">
                                <button id="saveModelBtn" type="button" class="btn btn-primary btn-sm w-100"><i class="fa-solid fa-plus"></i></button>
                            </div>
                        </form>
                        <table class="table table-sm">
                            <thead><tr><th>Imagem</th><th>Fornecedor</th><th>Modelo</th><th>Protocolo</th><th></th></tr></thead>
                            <tbody id="modelListBody"></tbody>
                        </table>
                    </div>
                    <div class="modal-footer">
                        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Fechar</button>
                    </div>
                </div>
            </div>
        </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="main.js"></script>
</body>

</html>
