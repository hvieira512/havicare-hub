# Sobreposição dos cenários, apanhada pelo `COMPOSE_FILE` em `tests/scenarios/lib/common.sh`.
# Mantém-nos fora do ambiente de desenvolvimento: projeto, contentores e base de dados
# próprios. Ver `docs/16-testes.md`.
#
# O `container_name` tem de ser anulado -- um nome fixo ignora o nome do projeto. As portas
# do anfitrião são retiradas em vez de deslocadas, porque os cenários falam com os serviços
# de dentro da rede; só a dashboard é lida de fora.

# O `restart` também é anulado: o compose base tem `unless-stopped`, que é o que se quer para
# quem desenvolve e é errado aqui -- uma pilha de testes não se levanta sozinha depois de a
# máquina reiniciar, nem fica a ocupar meio giga à espera da corrida seguinte.

services:
  mosquitto:
    container_name: !reset null
    restart: !override "no"
    ports: !reset []

  redis:
    container_name: !reset null
    restart: !override "no"
    ports: !reset []

  mysql:
    container_name: !reset null
    restart: !override "no"
    ports: !reset []
    volumes: !override
      - scenario_mysql_data:/var/lib/mysql

  hub:
    container_name: !reset null
    restart: !override "no"
    ports: !override
      - "8181:8081"

volumes:
  scenario_mysql_data:
