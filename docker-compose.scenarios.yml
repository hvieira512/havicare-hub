# Sobreposição dos cenários (`COMPOSE_FILE` em `tests/scenarios/lib/common.sh`), com projeto,
# contentores e base de dados próprios. Anula o `container_name` e retira as portas do anfitrião.

# O `restart` também é anulado: uma pilha de testes não se levanta sozinha quando a máquina
# reinicia.

services:
  mosquitto:
    container_name: !reset null
    restart: !override "no"
    ports: !reset []

  redis:
    container_name: !reset null
    restart: !override "no"
    ports: !reset []

  mysql:
    container_name: !reset null
    restart: !override "no"
    ports: !reset []
    volumes: !override
      - scenario_mariadb_data:/var/lib/mysql

  hub:
    container_name: !reset null
    restart: !override "no"
    # Sem o vigia do `bin/dev.sh`: um ficheiro mexido a meio reiniciava o hub depois de pronto, e
    # um hub que morre deve parar o cenário em vez de renascer em silêncio.
    command: !override sh -lc "composer install --no-interaction || composer install --no-interaction; php bin/migrate.php && php bin/seed-inventory.php && exec php bin/server-hub.php"
    ports: !override
      - "8181:8081"

volumes:
  scenario_mariadb_data:
