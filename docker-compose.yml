# Fixo, e não derivado da pasta: o nome do projeto dá nome aos volumes.
name: havicare-hub

services:
  mosquitto:
    image: eclipse-mosquitto:2
    container_name: havicare-mosquitto
    ports:
      - "1883:1883"
    volumes:
      - ./config/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
    networks:
      default:
        aliases:
          - mosquitto
    restart: unless-stopped

  redis:
    # A produção corre 8.2.
    image: redis:8-alpine
    container_name: havicare-redis
    ports:
      - "6379:6379"
    networks:
      default:
        aliases:
          - redis
    restart: unless-stopped

  mysql:
    # O motor da produção, para os testes correrem contra ele.
    image: mariadb:11.8
    container_name: havicare-mysql
    environment:
      MYSQL_DATABASE: ${MYSQL_DB_NAME:-havicare_hub}
      MYSQL_USER: ${MYSQL_DB_USER:-hub}
      MYSQL_PASSWORD: ${MYSQL_DB_PASSWORD:-hub_pass}
      MYSQL_ROOT_PASSWORD: ${HUB_DB_ROOT_PASSWORD:-root_pass}
    ports:
      - "3306:3306"
    volumes:
      - mariadb_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 30
    networks:
      default:
        aliases:
          - mysql
    restart: unless-stopped

  hub:
    build: .
    container_name: havicare-hub
    # O vendor/ não vem no clone e o bind mount esconde o da imagem: instala-se antes do migrate.php.
    # ponytail: a repetição contorna corridas de extração nos bind mounts do macOS; sai quando o
    # vendor/ passar a volume nomeado.
    command: sh -lc "composer install --no-interaction || composer install --no-interaction; php bin/migrate.php && php bin/seed-inventory.php && exec bin/dev.sh php bin/server-hub.php"
    ports:
      - "8081:8081"
      - "9000:9000"
    volumes:
      - .:/app
    environment:
      # O mosquitto local por omissão, e não o MQTT_HOST do .env, que aponta para um broker remoto;
      # HUB_MQTT_HOST=mqtt.havicare.com pede o remoto de propósito.
      MQTT_HOST: ${HUB_MQTT_HOST:-mosquitto}
      MQTT_PORT: ${HUB_MQTT_PORT:-1883}
      MQTT_TOPIC_PREFIX: ${MQTT_TOPIC_PREFIX:-}
      MQTT_CLIENT_ID_PREFIX: ${MQTT_CLIENT_ID_PREFIX:-havicare-hub-dev}
      MQTT_USERNAME: ${MQTT_USERNAME:-}
      MQTT_PASSWORD: ${MQTT_PASSWORD:-}
      REDIS_HOST: redis
      DB_DRIVER: ${HUB_DB_DRIVER:-mysql}
      DB_HOST: ${HUB_DB_HOST:-mysql}
      DB_PORT: ${HUB_DB_PORT:-3306}
      DB_NAME: ${HUB_DB_NAME:-havicare_hub}
      DB_USER: ${HUB_DB_USER:-hub}
      DB_PASSWORD: ${HUB_DB_PASSWORD:-hub_pass}
      DB_CHARSET: ${HUB_DB_CHARSET:-utf8mb4}
      DASHBOARD_HOST: 0.0.0.0
      DASHBOARD_API_AUTH_REQUIRED: ${DASHBOARD_API_AUTH_REQUIRED:-true}
      QINGLANST_ENABLED: ${QINGLANST_ENABLED:-false}
      QINGLANST_MQTT_HOST: ${QINGLANST_MQTT_HOST:-}
      # O `qinglanst-radar` sem sufixo é o identificador da produção, e dois iguais
      # expulsam-se do broker em ciclo: o default local é o mesmo do `.env.example`.
      QINGLANST_CLIENT_ID_PREFIX: ${QINGLANST_CLIENT_ID_PREFIX:-qinglanst-radar-local}
      TCP_INGRESS_HOST: 0.0.0.0
      TCP_INGRESS_PORT: 9000
      LOCATION_RESOLUTION_ENABLED: ${LOCATION_RESOLUTION_ENABLED:-true}
      BEACONDB_ENDPOINT: ${BEACONDB_ENDPOINT:-https://api.beacondb.net/v1/geolocate}
      BEACONDB_USER_AGENT: ${BEACONDB_USER_AGENT:-Havicare Hub/1.0}
      RADIO_MAP_ENABLED: ${RADIO_MAP_ENABLED:-true}
      RADIO_MAP_HASH_KEY: ${RADIO_MAP_HASH_KEY:-}
    depends_on:
      mosquitto:
        condition: service_started
      redis:
        condition: service_started
      # O migrate.php corre ao arranque: espera que a inicialização da base termine.
      mysql:
        condition: service_healthy
    networks:
      default:
        aliases:
          - hub
    restart: unless-stopped

volumes:
  mariadb_data:
