services:
  mosquitto:
    image: eclipse-mosquitto:2
    container_name: hitecosystem-mosquitto
    command: sh -lc "/mosquitto/config/bootstrap.sh && exec mosquitto -c /mosquitto/config/mosquitto.conf"
    ports:
      - "1883:1883"
      - "8883:8883"
    volumes:
      - ./config/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
      - ./bin/mosquitto-bootstrap.sh:/mosquitto/config/bootstrap.sh:ro
      - ./config/ssl:/mosquitto/config/certs:ro
    environment:
      MQTT_PUBLISHER_USERNAME: ${MQTT_PUBLISHER_USERNAME:-hub_publisher}
      MQTT_PUBLISHER_PASSWORD: ${MQTT_PUBLISHER_PASSWORD:-hub_publisher_pass}
      MQTT_SMOKE_USERNAME: ${MQTT_SMOKE_USERNAME:-hub_smoke}
      MQTT_SMOKE_PASSWORD: ${MQTT_SMOKE_PASSWORD:-hub_smoke_pass}
    networks:
      default:
        aliases:
          - mosquitto
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: hitecosystem-redis
    ports:
      - "6379:6379"
    networks:
      default:
        aliases:
          - redis
    restart: unless-stopped

  mysql:
    image: mysql:8.4
    container_name: hitecosystem-mysql
    environment:
      MYSQL_DATABASE: ${DB_NAME:-hitecosystem_hub}
      MYSQL_USER: ${DB_USER:-hub}
      MYSQL_PASSWORD: ${DB_PASSWORD:-hub_pass}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-root_pass}
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      default:
        aliases:
          - mysql
    restart: unless-stopped

  hub:
    build: .
    container_name: hitecosystem-devices-hub
    command: bin/dev.sh php bin/server-hub.php
    ports:
      - "8081:8081"
      - "9000:9000"
    volumes:
      - .:/app
    environment:
      MQTT_HOST: mosquitto
      MQTT_PORT: ${MQTT_PORT:-1883}
      MQTT_TOPIC_PREFIX: ${MQTT_TOPIC_PREFIX-}
      MQTT_USERNAME: ${MQTT_PUBLISHER_USERNAME:-hub_publisher}
      MQTT_PASSWORD: ${MQTT_PUBLISHER_PASSWORD:-hub_publisher_pass}
      MQTT_PUBLISHER_USERNAME: ${MQTT_PUBLISHER_USERNAME:-hub_publisher}
      MQTT_PUBLISHER_PASSWORD: ${MQTT_PUBLISHER_PASSWORD:-hub_publisher_pass}
      REDIS_HOST: redis
      REDIS_PORT: ${REDIS_PORT:-6379}
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
      DB_DRIVER: ${DB_DRIVER:-mysql}
      DB_HOST: mysql
      DB_PORT: ${DB_PORT:-3306}
      DB_NAME: ${DB_NAME:-hitecosystem_hub}
      DB_USER: ${DB_USER:-hub}
      DB_PASSWORD: ${DB_PASSWORD:-hub_pass}
      DB_CHARSET: ${DB_CHARSET:-utf8mb4}
      DOWNLINK_QUEUE_TTL_SECONDS: ${DOWNLINK_QUEUE_TTL_SECONDS:-300}
      WHITELIST_FILE: ${WHITELIST_FILE-}
      DASHBOARD_ENABLED: ${DASHBOARD_ENABLED:-true}
      DASHBOARD_HOST: 0.0.0.0
      DASHBOARD_PORT: ${DASHBOARD_PORT:-8081}
      DASHBOARD_USERNAME: ${DASHBOARD_USERNAME:-}
      DASHBOARD_PASSWORD: ${DASHBOARD_PASSWORD:-}
      DASHBOARD_HISTORY_LIMIT: ${DASHBOARD_HISTORY_LIMIT:-100}
      DASHBOARD_COMMAND_TIMEOUT_SECONDS: ${DASHBOARD_COMMAND_TIMEOUT_SECONDS:-3600}
      TCP_INGRESS_HOST: 0.0.0.0
      TCP_INGRESS_PORT: 9000
    depends_on:
      - mosquitto
      - redis
      - mysql
    networks:
      default:
        aliases:
          - hub
    restart: unless-stopped

volumes:
  mysql_data:
