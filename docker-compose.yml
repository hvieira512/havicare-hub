services:
  mosquitto:
    image: eclipse-mosquitto:2
    container_name: hitecosystem-mosquitto
    command: sh -lc "/mosquitto/config/bootstrap.sh && exec mosquitto -c /mosquitto/config/mosquitto.conf"
    ports:
      - "1883:1883"
      - "8883:8883"
    volumes:
      - ./config/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
      - ./bin/mosquitto-bootstrap.sh:/mosquitto/config/bootstrap.sh:ro
      - ./config/ssl:/mosquitto/config/certs:ro
    environment:
      MQTT_PUBLISHER_USERNAME: ${MQTT_PUBLISHER_USERNAME:-hub_publisher}
      MQTT_PUBLISHER_PASSWORD: ${MQTT_PUBLISHER_PASSWORD:-hub_publisher_pass}
      MQTT_SMOKE_USERNAME: ${MQTT_SMOKE_USERNAME:-hub_smoke}
      MQTT_SMOKE_PASSWORD: ${MQTT_SMOKE_PASSWORD:-hub_smoke_pass}
    networks:
      default:
        aliases:
          - mosquitto
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: hitecosystem-redis
    ports:
      - "6379:6379"
    networks:
      default:
        aliases:
          - redis
    restart: unless-stopped

  mysql:
    image: mysql:8.4
    container_name: hitecosystem-mysql
    environment:
      MYSQL_DATABASE: ${MYSQL_DB_NAME:-hitecosystem_hub}
      MYSQL_USER: ${MYSQL_DB_USER:-hub}
      MYSQL_PASSWORD: ${MYSQL_DB_PASSWORD:-hub_pass}
      MYSQL_ROOT_PASSWORD: ${HUB_DB_ROOT_PASSWORD:-root_pass}
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      default:
        aliases:
          - mysql
    restart: unless-stopped

  hub:
    build: .
    container_name: hitecosystem-devices-hub
    command: sh -lc "php bin/migrate.php && exec bin/dev.sh php bin/server-hub.php"
    ports:
      - "8081:8081"
      - "9000:9000"
    volumes:
      - .:/app
    environment:
      MQTT_HOST: ${MQTT_HOST:-mosquitto}
      MQTT_PORT: ${MQTT_PORT:-1883}
      MQTT_TOPIC_PREFIX: ${MQTT_TOPIC_PREFIX:-}
      MQTT_CLIENT_ID_PREFIX: ${MQTT_CLIENT_ID_PREFIX:-havicare-hub-dev}
      MQTT_USERNAME: ${MQTT_USERNAME:-}
      MQTT_PASSWORD: ${MQTT_PASSWORD:-}
      REDIS_HOST: redis
      REDIS_PORT: ${REDIS_PORT:-6379}
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
      DB_DRIVER: ${HUB_DB_DRIVER:-mysql}
      DB_HOST: ${HUB_DB_HOST:-mysql}
      DB_PORT: ${HUB_DB_PORT:-3306}
      DB_NAME: ${HUB_DB_NAME:-hitecosystem_hub}
      DB_USER: ${HUB_DB_USER:-hub}
      DB_PASSWORD: ${HUB_DB_PASSWORD:-hub_pass}
      DB_CHARSET: ${HUB_DB_CHARSET:-utf8mb4}
      DOWNLINK_QUEUE_TTL_SECONDS: ${DOWNLINK_QUEUE_TTL_SECONDS:-300}
      WHITELIST_FILE: ${WHITELIST_FILE-}
      DASHBOARD_HOST: 0.0.0.0
      DASHBOARD_PORT: ${DASHBOARD_PORT:-8081}
      DASHBOARD_API_AUTH_REQUIRED: ${DASHBOARD_API_AUTH_REQUIRED:-true}
      DASHBOARD_HISTORY_LIMIT: ${DASHBOARD_HISTORY_LIMIT:-100}
      DASHBOARD_COMMAND_TIMEOUT_SECONDS: ${DASHBOARD_COMMAND_TIMEOUT_SECONDS:-3600}
      QINGLANST_ENABLED: ${QINGLANST_ENABLED:-false}
      MOKO_GATEWAY_ENABLED: ${MOKO_GATEWAY_ENABLED:-true}
      MOKO_GATEWAY_TOPIC_FILTER: ${MOKO_GATEWAY_TOPIC_FILTER:-havicare-hub/null/0/gw/+/raw}
      MOKO_GATEWAY_DEDUPE_TTL_SECONDS: ${MOKO_GATEWAY_DEDUPE_TTL_SECONDS:-5}
      MOKO_GATEWAY_TELEMETRY_REFRESH_SECONDS: ${MOKO_GATEWAY_TELEMETRY_REFRESH_SECONDS:-60}
      MOKO_GATEWAY_IDLE_TIMEOUT_SECONDS: ${MOKO_GATEWAY_IDLE_TIMEOUT_SECONDS:-180}
      QINGLANST_MQTT_HOST: ${QINGLANST_MQTT_HOST:-}
      QINGLANST_MQTT_PORT: ${QINGLANST_MQTT_PORT:-1883}
      QINGLANST_MQTT_USERNAME: ${QINGLANST_MQTT_USERNAME:-}
      QINGLANST_MQTT_PASSWORD: ${QINGLANST_MQTT_PASSWORD:-}
      QINGLANST_TOPIC_FILTER: ${QINGLANST_TOPIC_FILTER:-radar/1001/#}
      QINGLANST_CLIENT_ID_PREFIX: ${QINGLANST_CLIENT_ID_PREFIX:-qinglanst-radar}
      TCP_INGRESS_HOST: 0.0.0.0
      TCP_INGRESS_PORT: 9000
      LOCATION_RESOLUTION_ENABLED: ${LOCATION_RESOLUTION_ENABLED:-true}
      BEACONDB_ENDPOINT: ${BEACONDB_ENDPOINT:-https://api.beacondb.net/v1/geolocate}
      BEACONDB_USER_AGENT: ${BEACONDB_USER_AGENT:-HaviCare Devices Hub/1.0}
      BEACONDB_TIMEOUT_SECONDS: ${BEACONDB_TIMEOUT_SECONDS:-2}
      BEACONDB_MAX_ACCURACY_METERS: ${BEACONDB_MAX_ACCURACY_METERS:-500}
      BEACONDB_CACHE_TTL_SECONDS: ${BEACONDB_CACHE_TTL_SECONDS:-86400}
      BEACONDB_FAILURE_CACHE_TTL_SECONDS: ${BEACONDB_FAILURE_CACHE_TTL_SECONDS:-60}
      LOCATION_PROVIDER_MAX_CONCURRENCY: ${LOCATION_PROVIDER_MAX_CONCURRENCY:-5}
      LOCATION_PROVIDER_MAX_QUEUE: ${LOCATION_PROVIDER_MAX_QUEUE:-1000}
      LOCATION_CIRCUIT_FAILURE_THRESHOLD: ${LOCATION_CIRCUIT_FAILURE_THRESHOLD:-3}
      LOCATION_CIRCUIT_OPEN_SECONDS: ${LOCATION_CIRCUIT_OPEN_SECONDS:-300}
      LOCATION_RATE_LIMIT_OPEN_SECONDS: ${LOCATION_RATE_LIMIT_OPEN_SECONDS:-3600}
      RADIO_MAP_ENABLED: ${RADIO_MAP_ENABLED:-true}
      RADIO_MAP_HASH_KEY: ${RADIO_MAP_HASH_KEY:-}
      RADIO_MAP_MINIMUM_MATCHES: ${RADIO_MAP_MINIMUM_MATCHES:-2}
      RADIO_MAP_MAXIMUM_LEARNING_ACCURACY_METERS: ${RADIO_MAP_MAXIMUM_LEARNING_ACCURACY_METERS:-100}
      RADIO_MAP_DEFAULT_GPS_ACCURACY_METERS: ${RADIO_MAP_DEFAULT_GPS_ACCURACY_METERS:-50}
      RADIO_MAP_MINIMUM_SATELLITES: ${RADIO_MAP_MINIMUM_SATELLITES:-4}
      RADIO_MAP_MAXIMUM_OBSERVATION_DISTANCE_METERS: ${RADIO_MAP_MAXIMUM_OBSERVATION_DISTANCE_METERS:-250}
      RADIO_MAP_CLUSTER_RADIUS_METERS: ${RADIO_MAP_CLUSTER_RADIUS_METERS:-150}
      RADIO_MAP_CACHE_TTL_SECONDS: ${RADIO_MAP_CACHE_TTL_SECONDS:-60}
    depends_on:
      - mosquitto
      - redis
      - mysql
    networks:
      default:
        aliases:
          - hub
    restart: unless-stopped

volumes:
  mysql_data:
